<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 76" width="880" height="76" role="img" aria-label="Terminal Footer">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: cursorBlink 1.1s infinite; }
    </style>
  </defs>
  <rect width="880" height="76" rx="12" fill="#090d1a" stroke="url(#termBorder)" stroke-opacity="0.45" stroke-width="1.5" />
  <circle cx="24" cy="20" r="5" fill="#f472b6" />
  <circle cx="42" cy="20" r="5" fill="#a855f7" />
  <circle cx="60" cy="20" r="5" fill="#00f5d4" />
  <text x="24" y="52" class="mono" font-size="13" fill="#00f5d4">vicky@ml-infra:~$</text>
  <text x="166" y="52" class="mono" font-size="13" fill="#e2e8f0">echo "Always building deterministic, observable AI &amp; backend systems."</text>
  <rect class="cursor" x="742" y="39" width="8" height="16" fill="#f472b6" />
</svg>
