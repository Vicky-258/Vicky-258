<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="880" height="215" role="img" aria-label="Core Tech Stack Matrix">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#0d1426" />
    </linearGradient>
    <linearGradient id="borderM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="33%" stop-color="#38bdf8" />
      <stop offset="66%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .d1 { animation: pulseDot 2.4s ease-in-out 0s infinite; }
      .d2 { animation: pulseDot 2.4s ease-in-out 0.6s infinite; }
      .d3 { animation: pulseDot 2.4s ease-in-out 1.2s infinite; }
      .d4 { animation: pulseDot 2.4s ease-in-out 1.8s infinite; }
    </style>
  </defs>

  <rect width="880" height="215" rx="16" fill="url(#bgM)" stroke="url(#borderM)" stroke-opacity="0.38" stroke-width="1.5" />

  <!-- Column 1: Languages -->
  <g transform="translate(28, 28)">
    <circle cx="6" cy="6" r="4" fill="#00f5d4" class="d1" />
    <text x="18" y="10" class="mono" font-size="11" font-weight="700" fill="#00f5d4" letter-spacing="1">LANGUAGES</text>

    <rect x="0" y="26" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="43" class="mono" font-size="11.5" fill="#e2e8f0">Python</text>
    <text x="172" y="43" text-anchor="end" class="mono" font-size="10" fill="#00f5d4">primary</text>

    <rect x="0" y="58" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="75" class="mono" font-size="11.5" fill="#e2e8f0">Rust / C</text>
    <text x="172" y="75" text-anchor="end" class="mono" font-size="10" fill="#64748b">systems</text>

    <rect x="0" y="90" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="107" class="mono" font-size="11.5" fill="#e2e8f0">SQL</text>
    <text x="172" y="107" text-anchor="end" class="mono" font-size="10" fill="#64748b">queries</text>

    <rect x="0" y="122" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="139" class="mono" font-size="11.5" fill="#e2e8f0">TypeScript</text>
    <text x="172" y="139" text-anchor="end" class="mono" font-size="10" fill="#64748b">ui</text>
  </g>

  <!-- Column 2: AI & Retrieval -->
  <g transform="translate(242, 28)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8" class="d2" />
    <text x="18" y="10" class="mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">AI &amp; RETRIEVAL</text>

    <rect x="0" y="26" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="43" class="mono" font-size="11.5" fill="#e2e8f0">PyTorch / sklearn</text>

    <rect x="0" y="58" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="75" class="mono" font-size="11.5" fill="#e2e8f0">LangGraph / Chain</text>

    <rect x="0" y="90" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="107" class="mono" font-size="11.5" fill="#e2e8f0">FAISS / Embeddings</text>

    <rect x="0" y="122" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="139" class="mono" font-size="11.5" fill="#e2e8f0">Ollama / RAG</text>
  </g>

  <!-- Column 3: Backends & UI -->
  <g transform="translate(456, 28)">
    <circle cx="6" cy="6" r="4" fill="#a855f7" class="d3" />
    <text x="18" y="10" class="mono" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">BACKENDS &amp; UI</text>

    <rect x="0" y="26" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="43" class="mono" font-size="11.5" fill="#e2e8f0">FastAPI / Pydantic</text>

    <rect x="0" y="58" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="75" class="mono" font-size="11.5" fill="#e2e8f0">Async / Workers</text>

    <rect x="0" y="90" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="107" class="mono" font-size="11.5" fill="#e2e8f0">State Machines</text>

    <rect x="0" y="122" width="184" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="139" class="mono" font-size="11.5" fill="#e2e8f0">Next.js / React</text>
  </g>

  <!-- Column 4: Data & Infra -->
  <g transform="translate(670, 28)">
    <circle cx="6" cy="6" r="4" fill="#f472b6" class="d4" />
    <text x="18" y="10" class="mono" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="1">DATA &amp; INFRA</text>

    <rect x="0" y="26" width="182" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="43" class="mono" font-size="11.5" fill="#e2e8f0">PostgreSQL / SQLite</text>

    <rect x="0" y="58" width="182" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="75" class="mono" font-size="11.5" fill="#e2e8f0">Docker / Kubernetes</text>

    <rect x="0" y="90" width="182" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="107" class="mono" font-size="11.5" fill="#e2e8f0">SimPy Simulation</text>

    <rect x="0" y="122" width="182" height="26" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="12" y="139" class="mono" font-size="11.5" fill="#e2e8f0">Linux / pytest</text>
  </g>
</svg>
