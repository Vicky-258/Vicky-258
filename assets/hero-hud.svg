<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Vigneshkumar S - AI/ML and Systems Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="50%" stop-color="#11162b" />
      <stop offset="100%" stop-color="#0a1628" />
    </linearGradient>

    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="33%" stop-color="#38bdf8" />
      <stop offset="66%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="876" height="276" rx="16" />
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-280px); }
        100% { transform: translateY(280px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -32; }
      }
      .float-g { animation: floatSlow 4.5s ease-in-out infinite; }
      .status-dot { animation: blink 1.4s infinite; }
      .scan { animation: scanline 6s linear infinite; }
      .edge-flow { stroke-dasharray: 6 10; animation: flowDash 1.2s linear infinite; }
      .edge-flow-rev { stroke-dasharray: 6 10; animation: flowDash 1.6s linear reverse infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="880" height="280" rx="16" fill="url(#bgGrad)" />
    <rect width="880" height="280" fill="url(#dotGrid)" opacity="0.8" />
    <circle cx="710" cy="135" r="175" fill="url(#glowCyan)" />
    <circle cx="575" cy="70" r="150" fill="url(#glowPurple)" />
    <circle cx="790" cy="210" r="120" fill="url(#glowPink)" />
    <rect class="scan" x="0" y="0" width="880" height="3" fill="url(#auroraGrad)" opacity="0.2" />

    <!-- Left HUD Content -->
    <g transform="translate(42, 40)">
      <rect x="0" y="0" width="242" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle class="status-dot" cx="16" cy="14" r="4.5" fill="#00f5d4" />
      <text x="29" y="18" class="mono" font-size="11" fill="#e2e8f0" letter-spacing="0.8">SYSTEM ONLINE // VICKY-258</text>

      <text x="0" y="78" class="sans" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.8">Vigneshkumar S</text>
      <rect x="0" y="93" width="160" height="4" rx="2" fill="url(#auroraGrad)" />
      <text x="0" y="124" class="sans" font-size="16" font-weight="500" fill="#cbd5e1">
        AI/ML Engineer · Applied AI, Retrieval &amp; Backend Systems
      </text>

      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="138" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <rect x="0" y="0" width="138" height="3" rx="1.5" fill="#00f5d4" />
        <text x="12" y="20" class="mono" font-size="10" fill="#94a3b8">FOCUS</text>
        <text x="12" y="38" class="mono" font-size="13" font-weight="700" fill="#00f5d4">AI/ML &amp; Systems</text>

        <rect x="150" y="0" width="138" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <rect x="150" y="0" width="138" height="3" rx="1.5" fill="#a855f7" />
        <text x="162" y="20" class="mono" font-size="10" fill="#94a3b8">DEGREE</text>
        <text x="162" y="38" class="mono" font-size="13" font-weight="700" fill="#c084fc">B.Tech AI &amp; ML</text>

        <rect x="300" y="0" width="138" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <rect x="300" y="0" width="138" height="3" rx="1.5" fill="#f472b6" />
        <text x="312" y="20" class="mono" font-size="10" fill="#94a3b8">ALGORITHMS</text>
        <text x="312" y="38" class="mono" font-size="13" font-weight="700" fill="#f472b6">250+ LeetCode</text>
      </g>
    </g>

    <!-- Right: Vibrant Animated Neural Constellation -->
    <g transform="translate(565, 20)">
      <g class="float-g">
        <circle cx="155" cy="120" r="96" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="6 8">
          <animateTransform attributeName="transform" type="rotate" from="0 155 120" to="360 155 120" dur="30s" repeatCount="indefinite" />
        </circle>
        <circle cx="155" cy="120" r="66" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 6">
          <animateTransform attributeName="transform" type="rotate" from="360 155 120" to="0 155 120" dur="20s" repeatCount="indefinite" />
        </circle>

        <path d="M 65 75 Q 110 65 155 120" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 155 120 Q 205 90 245 68" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 155 120 Q 200 160 240 185" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 65 175 Q 110 155 155 120" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 65 75 L 65 175" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />
        <path d="M 245 68 L 240 185" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />

        <path d="M 65 75 Q 110 65 155 120" fill="none" stroke="#a855f7" stroke-width="2.2" class="edge-flow" />
        <path d="M 155 120 Q 205 90 245 68" fill="none" stroke="#00f5d4" stroke-width="2.2" class="edge-flow" />
        <path d="M 155 120 Q 200 160 240 185" fill="none" stroke="#f472b6" stroke-width="2.2" class="edge-flow-rev" />
        <path d="M 65 175 Q 110 155 155 120" fill="none" stroke="#38bdf8" stroke-width="2.2" class="edge-flow" />

        <circle cx="155" cy="120" r="6" fill="none" stroke="#00f5d4" stroke-width="2">
          <animate attributeName="r" values="6;22" dur="2.2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="155" cy="120" r="10" fill="#0f172a" stroke="#00f5d4" stroke-width="2.5" />
        <circle cx="155" cy="120" r="4" fill="#00f5d4" />

        <circle cx="65" cy="75" r="8" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" />
        <text x="46" y="58" class="mono" font-size="9.5" font-weight="700" fill="#c084fc">AI/ML</text>

        <circle cx="65" cy="175" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
        <text x="42" y="198" class="mono" font-size="9.5" font-weight="700" fill="#38bdf8">PYTHON</text>

        <circle cx="245" cy="68" r="6" fill="none" stroke="#f472b6" stroke-width="2">
          <animate attributeName="r" values="6;20" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.9;0" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
        </circle>
        <circle cx="245" cy="68" r="8" fill="#0f172a" stroke="#f472b6" stroke-width="2.5" />
        <text x="228" y="51" class="mono" font-size="9.5" font-weight="700" fill="#f472b6">RUST</text>

        <circle cx="240" cy="185" r="8" fill="#0f172a" stroke="#00f5d4" stroke-width="2.5" />
        <text x="222" y="208" class="mono" font-size="9.5" font-weight="700" fill="#00f5d4">INFRA</text>
      </g>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="877" height="277" rx="16" fill="none" stroke="url(#auroraGrad)" stroke-opacity="0.45" stroke-width="1.5" />
</svg>
