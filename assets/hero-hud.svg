<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Vigneshkumar S - AI/ML and Systems Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="55%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#091526" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="878" height="278" rx="16" />
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-280px); }
        100% { transform: translateY(280px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -28; }
      }
      .float-g { animation: floatSlow 5s ease-in-out infinite; }
      .status-dot { animation: blink 1.6s infinite; }
      .scan { animation: scanline 7s linear infinite; }
      .edge-flow { stroke-dasharray: 5 9; animation: flowDash 1.4s linear infinite; }
      .edge-flow-rev { stroke-dasharray: 5 9; animation: flowDash 1.8s linear reverse infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="880" height="280" rx="16" fill="url(#bgGrad)" />
    <rect width="880" height="280" fill="url(#dotGrid)" opacity="0.7" />
    <circle cx="700" cy="140" r="170" fill="url(#glowCyan)" />
    <circle cx="560" cy="70" r="140" fill="url(#glowViolet)" />
    <rect class="scan" x="0" y="0" width="880" height="2" fill="url(#accentGrad)" opacity="0.12" />

    <!-- Left HUD Content -->
    <g transform="translate(42, 42)">
      <rect x="0" y="0" width="236" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle class="status-dot" cx="15" cy="13" r="4" fill="#2dd4bf" />
      <text x="27" y="17" class="mono" font-size="11" fill="#94a3b8" letter-spacing="0.8">SYSTEM ONLINE // VICKY-258</text>

      <text x="0" y="76" class="sans" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">Vigneshkumar S</text>
      <rect x="0" y="92" width="110" height="3" rx="1.5" fill="url(#accentGrad)" />
      <text x="0" y="122" class="sans" font-size="16" font-weight="500" fill="#cbd5e1">
        AI/ML Engineer · Applied AI, Retrieval Systems &amp; ML Infra
      </text>

      <g transform="translate(0, 148)">
        <rect x="0" y="0" width="132" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="17" class="mono" font-size="10" fill="#64748b">RETRIEVAL</text>
        <text x="12" y="34" class="mono" font-size="13" font-weight="700" fill="#38bdf8">15–18 ms</text>

        <rect x="144" y="0" width="132" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="156" y="17" class="mono" font-size="10" fill="#64748b">AUTOSCALE SLA</text>
        <text x="156" y="34" class="mono" font-size="13" font-weight="700" fill="#2dd4bf">14 → 0 ticks</text>

        <rect x="288" y="0" width="132" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="300" y="17" class="mono" font-size="10" fill="#64748b">LEETCODE</text>
        <text x="300" y="34" class="mono" font-size="13" font-weight="700" fill="#818cf8">250+ solved</text>
      </g>
    </g>

    <!-- Right: Animated Multi-Hop Graph & Orbital Topology -->
    <g transform="translate(565, 20)">
      <g class="float-g">
        <circle cx="155" cy="120" r="94" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6">
          <animateTransform attributeName="transform" type="rotate" from="0 155 120" to="360 155 120" dur="36s" repeatCount="indefinite" />
        </circle>
        <circle cx="155" cy="120" r="64" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4">
          <animateTransform attributeName="transform" type="rotate" from="360 155 120" to="0 155 120" dur="24s" repeatCount="indefinite" />
        </circle>

        <!-- Base Edges -->
        <path d="M 65 75 Q 110 65 155 120" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 155 120 Q 205 90 245 68" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 155 120 Q 200 160 240 185" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 65 175 Q 110 155 155 120" fill="none" stroke="#1e293b" stroke-width="1.5" />
        <path d="M 65 75 L 65 175" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 3" />
        <path d="M 245 68 L 240 185" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 3" />

        <!-- Animated Data Pulses along Edges -->
        <path d="M 65 75 Q 110 65 155 120" fill="none" stroke="#38bdf8" stroke-width="1.8" class="edge-flow" />
        <path d="M 155 120 Q 205 90 245 68" fill="none" stroke="#2dd4bf" stroke-width="1.8" class="edge-flow" />
        <path d="M 155 120 Q 200 160 240 185" fill="none" stroke="#818cf8" stroke-width="1.8" class="edge-flow-rev" />
        <path d="M 65 175 Q 110 155 155 120" fill="none" stroke="#38bdf8" stroke-width="1.8" class="edge-flow" />

        <!-- Center Hub + Pulse Ring -->
        <circle cx="155" cy="120" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5">
          <animate attributeName="r" values="6;20" dur="2.6s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.85;0" dur="2.6s" repeatCount="indefinite" />
        </circle>
        <circle cx="155" cy="120" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <circle cx="155" cy="120" r="3.5" fill="#38bdf8" />

        <!-- Top-Left Node -->
        <circle cx="65" cy="75" r="7" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
        <text x="42" y="60" class="mono" font-size="9" fill="#94a3b8">AGENT</text>

        <!-- Bottom-Left Node -->
        <circle cx="65" cy="175" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <text x="38" y="196" class="mono" font-size="9" fill="#94a3b8">VECTOR</text>

        <!-- Top-Right Node + Pulse Ring -->
        <circle cx="245" cy="68" r="6" fill="none" stroke="#2dd4bf" stroke-width="1.5">
          <animate attributeName="r" values="6;18" dur="2.6s" begin="1.3s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.85;0" dur="2.6s" begin="1.3s" repeatCount="indefinite" />
        </circle>
        <circle cx="245" cy="68" r="7" fill="#0f172a" stroke="#2dd4bf" stroke-width="2" />
        <text x="225" y="53" class="mono" font-size="9" fill="#94a3b8">GRAPH</text>

        <!-- Bottom-Right Node -->
        <circle cx="240" cy="185" r="7" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
        <text x="220" y="206" class="mono" font-size="9" fill="#94a3b8">K8S/GRU</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="878" height="278" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
