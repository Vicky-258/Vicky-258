<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="End-to-End Engineering Pipeline">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#0d1426" />
    </linearGradient>

    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="33%" stop-color="#38bdf8" />
      <stop offset="66%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes stream {
        to { stroke-dashoffset: -44; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      .bus-flow { stroke-dasharray: 10 12; animation: stream 1.3s linear infinite; }
      .p1 { animation: pulse 2.8s ease-in-out 0s infinite; }
      .p2 { animation: pulse 2.8s ease-in-out 0.7s infinite; }
      .p3 { animation: pulse 2.8s ease-in-out 1.4s infinite; }
      .p4 { animation: pulse 2.8s ease-in-out 2.1s infinite; }
    </style>
  </defs>

  <rect width="880" height="240" rx="16" fill="url(#bgCanvas)" stroke="url(#busGrad)" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="34" y="34" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1.4">END-TO-END ENGINEERING PIPELINE</text>

  <!-- Signal Bus -->
  <line x1="110" y1="98" x2="770" y2="98" stroke="#1e293b" stroke-width="3" />
  <line x1="110" y1="98" x2="770" y2="98" stroke="url(#busGrad)" stroke-width="3" class="bus-flow" />

  <!-- Stage 1: Applied AI -->
  <g transform="translate(110, 98)">
    <circle cx="0" cy="0" r="44" fill="url(#g1)" class="p1" />
    <circle cx="0" cy="0" r="22" fill="#0b1220" stroke="#00f5d4" stroke-width="2.5" />
    <path d="M 0 -9 L 2.5 -2.5 L 9 0 L 2.5 2.5 L 0 9 L -2.5 2.5 L -9 0 L -2.5 -2.5 Z" fill="#00f5d4" />
    <text x="0" y="-34" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#00f5d4">01</text>
    <text x="0" y="46" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#ffffff">Applied AI</text>
    <text x="0" y="66" text-anchor="middle" class="mono" font-size="10.5" fill="#cbd5e1">Agents · Eval · SimPy</text>
    <text x="0" y="84" text-anchor="middle" class="mono" font-size="10" fill="#00f5d4">LangGraph · PyTorch</text>
  </g>

  <!-- Stage 2: Retrieval -->
  <g transform="translate(330, 98)">
    <circle cx="0" cy="0" r="44" fill="url(#g2)" class="p2" />
    <circle cx="0" cy="0" r="22" fill="#0b1220" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="-6" y1="4" x2="0" y2="-6" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="0" y1="-6" x2="6" y2="4" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="-6" cy="4" r="2.8" fill="#38bdf8" />
    <circle cx="0" cy="-6" r="2.8" fill="#38bdf8" />
    <circle cx="6" cy="4" r="2.8" fill="#38bdf8" />
    <text x="0" y="-34" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8">02</text>
    <text x="0" y="46" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#ffffff">Retrieval</text>
    <text x="0" y="66" text-anchor="middle" class="mono" font-size="10.5" fill="#cbd5e1">Vector · Graph · Rank</text>
    <text x="0" y="84" text-anchor="middle" class="mono" font-size="10" fill="#38bdf8">FAISS · PostgreSQL</text>
  </g>

  <!-- Stage 3: Backends -->
  <g transform="translate(550, 98)">
    <circle cx="0" cy="0" r="44" fill="url(#g3)" class="p3" />
    <circle cx="0" cy="0" r="22" fill="#0b1220" stroke="#a855f7" stroke-width="2.5" />
    <path d="M -5 -5 L -9 0 L -5 5 M 5 -5 L 9 0 L 5 5 M 2 -6 L -2 6" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="-34" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#c084fc">03</text>
    <text x="0" y="46" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#ffffff">Backends</text>
    <text x="0" y="66" text-anchor="middle" class="mono" font-size="10.5" fill="#cbd5e1">Async · State Machines</text>
    <text x="0" y="84" text-anchor="middle" class="mono" font-size="10" fill="#c084fc">FastAPI · Rust · Python</text>
  </g>

  <!-- Stage 4: ML Infra -->
  <g transform="translate(770, 98)">
    <circle cx="0" cy="0" r="44" fill="url(#g4)" class="p4" />
    <circle cx="0" cy="0" r="22" fill="#0b1220" stroke="#f472b6" stroke-width="2.5" />
    <path d="M -9 1 L -4 1 L -1 -6 L 2 6 L 5 -2 L 9 -2" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="-34" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#f472b6">04</text>
    <text x="0" y="46" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#ffffff">ML Infra</text>
    <text x="0" y="66" text-anchor="middle" class="mono" font-size="10.5" fill="#cbd5e1">Forecasting · Scaling</text>
    <text x="0" y="84" text-anchor="middle" class="mono" font-size="10" fill="#f472b6">Docker · Kubernetes</text>
  </g>
</svg>
